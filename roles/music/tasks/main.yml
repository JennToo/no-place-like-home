- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - ardour
      - ardour-lv2-plugins
      - carla
      - lsp-plugins-lv2
      - pipewire-jack
- name: Setup system files
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "pipewire-jack-x86_64-linux-gnu.conf"
      dest: "/etc/ld.so.conf.d/pipewire-jack-x86_64-linux-gnu.conf"
    - src: "audio-limits.conf"
      dest: "/etc/security/limits.d/audio.conf"
- name: Setup user directories
  ansible.builtin.file:
    dest: "{{ home }}/{{ item }}"
    state: directory
    mode: "755"
  loop:
    - .config/pipewire/pipewire.conf.d
- name: Setup user files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "pipewire.conf"
      dest: "{{ home }}/.config/pipewire/pipewire.conf.d/pipewire-overrides.conf"
- name: Add user to groups
  become: true
  ansible.builtin.user:
    name: "{{ user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - audio
- name: Download furnace
  ansible.builtin.get_url:
    url: https://github.com/tildearrow/furnace/releases/download/v0.6.8.3/furnace-0.6.8.3-linux-x86_64.tar.gz
    dest: "{{ home }}/.cache/furnace-0.6.8.3-linux-x86_64.tar.gz"
    mode: "644"
    checksum: sha256:298a4e30bbdfe5ad88ed7f3bd90bd657a3f0b2e6e7dfc2091663dda71424d555
- name: Extract furnace
  become: true
  ansible.builtin.unarchive:
    creates: "/opt/furnace/furnace"
    src: "{{ home }}/.cache/furnace-0.6.8.3-linux-x86_64.tar.gz"
    dest: "/opt/"
- name: Add theusualsuspects repo
  become: true
  ansible.builtin.deb822_repository:
    name: theusualsuspects
    types: [deb]
    uris: https://download.opensuse.org/repositories/home:/theusualsuspects/xUbuntu_26.04/
    suites: [/]
    signed_by: "https://download.opensuse.org/repositories/home:/theusualsuspects/xUbuntu_26.04/Release.key"
- name: Install theusualsuspects apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
    update_cache: yes
    cache_valid_time: 3600
  vars:
    packages:
      - theusualsuspects-88emu
      - theusualsuspects-je8086
      - theusualsuspects-ostirus
