- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - carla
      - pipewire-jack
- name: Download furnace
  ansible.builtin.get_url:
    url: https://github.com/tildearrow/furnace/releases/download/v0.6.8.3/furnace-0.6.8.3-linux-x86_64.tar.gz
    dest: "{{ home }}/.cache/furnace-0.6.8.3-linux-x86_64.tar.gz"
    mode: "644"
    checksum: sha256:298a4e30bbdfe5ad88ed7f3bd90bd657a3f0b2e6e7dfc2091663dda71424d555
- name: Extract furnace
  become: true
  ansible.builtin.unarchive:
    creates: "/opt/furnace/furnace"
    src: "{{ home }}/.cache/furnace-0.6.8.3-linux-x86_64.tar.gz"
    dest: "/opt/"
