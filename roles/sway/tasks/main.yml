---
- name: Setup configuration directories
  ansible.builtin.file:
    dest: "{{ home }}/{{ item }}"
    state: directory
    mode: "755"
  with_items:
    - .config/systemd/user
- name: Install service units
  ansible.builtin.file:
    src: "{{ playbook_dir }}/roles/sway/files/{{ item }}"
    dest: "{{ home }}/.config/systemd/user/{{ item }}"
    state: link
    force: true
  loop:
    - labwc-headless.service
- name: Install VNC script
  become: true
  ansible.builtin.copy:
    src: labwc-headless-vnc.sh
    dest: /usr/local/bin/labwc-headless-vnc.sh
    mode: "0755"
- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - kanshi
      - labwc
      - mako-notifier
      - suckless-tools
      - sway
      - swayidle
      - swaylock
      - waybar
      - wayvnc
