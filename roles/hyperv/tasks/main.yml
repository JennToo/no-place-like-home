---
- name: Disable services
  become: true
  ansible.builtin.systemd_service:
    enabled: false
    name: "{{ item }}"
  loop:
    - ModemManager.service
    - avahi-daemon.service
    - cups-browsed.service
    - cups.service
    - gdm.service
    - gnome-remote-desktop.service
    - switcheroo-control.service
    - wpa_supplicant.service
