- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - bear
      - clang-format
      - clang-tidy
      - clang-tools
      - clangd
      - cmake
      - gdb
      - ninja-build
      - gcc-arm-none-eabi
      - libnewlib-arm-none-eabi
      - libstdc++-arm-none-eabi-newlib
