---
- name: Setup configuration directories
  ansible.builtin.file:
    dest: "{{ home }}/{{ item }}"
    state: directory
    mode: "755"
  with_items:
    - .config
    - .config/emacs
    - .config/sway
    - .config/foot
    - .config/kanshi
    - .config/waybar
    - .local/bin
    - .local/src
    - .local/share/qalculate
    - .virtualenvs
    - .local/share
    - .local/share/neovim
    - .fonts
    - .vsnip-local
- name: Setup sensitive directories
  ansible.builtin.file:
    dest: "{{ home }}/{{ item }}"
    state: directory
    mode: "700"
  with_items:
    - .gnupg
    - .ssh
- name: Install dotfiles
  ansible.builtin.file:
    src: "{{ playbook_dir }}/dotfiles/{{ item.src }}"
    dest: "{{ home }}/{{ item.dest }}"
    state: link
    force: true
  with_items:
    - src: gitignore
      dest: .gitignore
    - src: fdignore
      dest: .fdignore
    - src: config/nvim
      dest: .config/nvim
    - src: config/alacritty.toml
      dest: .config/alacritty.toml
    - src: gnupg/gpg.conf
      dest: .gnupg/gpg.conf
    - src: gnupg/gpg-agent.conf
      dest: .gnupg/gpg-agent.conf
    - src: bashrc
      dest: .bashrc
    - src: inputrc
      dest: .inputrc
    - src: profile
      dest: .profile
    - src: tmux.conf
      dest: .tmux.conf
    - src: Xresources
      dest: .Xresources
    - src: ideavimrc
      dest: .ideavimrc
    - src: sbclrc
      dest: .sbclrc
    - src: sway-config
      dest: .config/sway/config
    - src: kanshi-config
      dest: .config/kanshi/config
    - src: labwc
      dest: .config/labwc
    - src: config/foot/foot.ini
      dest: .config/foot/foot.ini
    - src: waybar-config.jsonc
      dest: .config/waybar/config
    - src: waybar-style.css
      dest: .config/waybar/style.css
    - src: vsnip
      dest: .vsnip
    - src: qalculate-definitions
      dest: .local/share/qalculate/definitions
- name: Install local scripts
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ home }}/.local/bin/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ playbook_dir }}/bin/*"
- name: Generate ssh-config
  ansible.builtin.template:
    src: templates/ssh-config
    dest: "{{ home }}/.ssh/config"
    mode: "600"
- name: Generate templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "655"
  loop:
    - src: templates/gitconfig
      dest: "{{ home }}/.gitconfig"
- name: Setup neovim virtualenv Python 3
  ansible.builtin.pip:
    name: "{{ item }}"
    virtualenv: "{{ home }}/.virtualenvs/neovim-py3"
    virtualenv_python: python3
    state: latest
  loop:
    - jedi
    - pynvim
    - python-lsp-server
- name: Setup pylsp symlink
  ansible.builtin.file:
    src: "{{ home }}/.virtualenvs/neovim-py3/bin/pylsp"
    dest: "{{ home }}/.local/bin/pylsp"
    state: link
    force: true
- name: Download neovim
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ nvim_version }}/nvim-linux-x86_64.tar.gz"
    checksum: "sha256:{{ nvim_hash }}"
    dest: "{{ home }}/.cache/nvim-{{ nvim_version }}.tar.gz"
- name: Setup neovim directory
  ansible.builtin.file:
    dest: "{{ home }}/.cache/nvim-{{ nvim_version }}/"
    state: directory
    mode: "755"
- name: Extract neovim
  ansible.builtin.unarchive:
    creates: "{{ home }}/.cache/nvim-{{ nvim_version }}/nvim-linux64/bin/nvim"
    src: "{{ home }}/.cache/nvim-{{ nvim_version }}.tar.gz"
    dest: "{{ home }}/.cache/nvim-{{ nvim_version }}/"
- name: Symlink neovim
  ansible.builtin.file:
    src: "{{ home }}/.cache/nvim-{{ nvim_version }}/nvim-linux-x86_64/bin/nvim"
    dest: "{{ home }}/.local/bin/nvim"
    state: link
    force: true
- name: Setup fd symlink
  ansible.builtin.file:
    src: "/usr/bin/fd"
    dest: "{{ home }}/.local/bin/fdfind"
    state: link
    force: true
