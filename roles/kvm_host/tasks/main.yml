---
- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - bridge-utils
      - genisoimage
      - libvirt-clients
      - libvirt-daemon-system
      - ovmf
      - qemu-system-x86
      - swtpm
      - swtpm-tools
      - virt-manager
      - virt-viewer
      - virtiofsd
- name: Add user to groups
  become: true
  ansible.builtin.user:
    name: "{{ user }}"
    groups: "{{ item }}"
    append: true
  loop:
    - kvm
    - libvirt
- name: Enable libvirtd service
  become: true
  ansible.builtin.systemd_service:
    enabled: true
    state: started
    name: libvirtd.service
