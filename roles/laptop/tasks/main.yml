---
- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages }}"
  vars:
    packages:
      - smartmontools
      - tlp
      - tlp-rdw
- name: Enable tlp service
  become: true
  ansible.builtin.systemd_service:
    enabled: true
    state: started
    name: tlp.service
