- name: Create destinations
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ home }}/.local/share/vhdl-ls"
- name: Download VHDL LS
  ansible.builtin.get_url:
    url: https://github.com/VHDL-LS/rust_hdl/releases/download/v0.84.0/vhdl_ls-x86_64-unknown-linux-gnu.zip
    dest: "{{ home }}/.local/share/vhdl_ls-0.84.0.zip"
    checksum: sha256:e2f1550c987c5f4226cc0f854f6963dbdc3badddaa8a82f4a550e183c0c6b503
    mode: "0644"
  register: vhdl_ls_download
- name: Install VHDL LS
  ansible.builtin.unarchive:
    src: "{{ vhdl_ls_download.dest }}"
    dest: "{{ home }}/.local/share/vhdl-ls/"
  when: vhdl_ls_download.changed
- name: Link VHDL LS
  ansible.builtin.file:
    src: "{{ home }}/.local/share/vhdl-ls/vhdl_ls-x86_64-unknown-linux-gnu/bin/vhdl_ls"
    dest: "{{ home }}/.local/bin/vhdl_ls"
    state: link
    force: true
